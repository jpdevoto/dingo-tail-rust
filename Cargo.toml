[package]
name = "dingotail"
version = "0.2.0"
edition = "2024"
authors = ["Juan Pablo Devoto"]
license = "GPL-3.0-only"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
tokio = { version = "1", features = ["full"] }
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
eframe = { version = "0.33", default-features = false, features = ["wgpu"] }
wgpu = { version = "27.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
eframe = { version = "0.33", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[features]
qa = []

[dev-dependencies]
rand = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

